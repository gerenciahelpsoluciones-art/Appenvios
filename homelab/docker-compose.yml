# Supabase propio del CRM (HelpiCRM) en el homelab.
# La misma base la usan velia, 2rpits, helpmarketing y la web de Help: se mudan todas juntas.
#
# Entrada pública: VPS Licitix (HTTPS) → Tailscale → este equipo, puerto 8300 (nginx).
#   nginx (límite de peticiones) → gateway Caddy → rest / auth / realtime / storage / functions
#
# Primera vez:  python3 generar-env.py  →  completar .env  →  ./preparar-funciones.sh
#               ./restaurar.sh <respaldo.dump>  →  docker compose up -d
#               python3 subir-storage.py <carpeta storage>
name: crm

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.159
    container_name: crm-db
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [crm-net]

  rest:
    image: public.ecr.aws/supabase/postgrest:v14.18
    container_name: crm-rest
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    command: ["postgrest"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@crm-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_DB_MAX_ROWS: 1000          # igual que Supabase en la nube: la app pagina de a 1000
    networks: [crm-net]

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    container_name: crm-auth
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@crm-db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ""
      GOTRUE_DISABLE_SIGNUP: "true"    # nadie se crea cuenta solo; velia y el CRM crean usuarios con la llave de servidor
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
    networks: [crm-net]

  realtime:
    image: supabase/realtime:v2.151.5
    container_name: crm-realtime
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 4000
      DB_HOST: crm-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"           # crea el tenant "realtime-dev" (el gateway manda ese Host)
      RUN_JANITOR: "true"
    networks: [crm-net]

  storage:
    image: supabase/storage-api:v1.89.2
    container_name: crm-storage
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://crm-rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@crm-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - crm-storage-data:/var/lib/storage
    networks: [crm-net]

  functions:
    image: supabase/edge-runtime:v1.77.9
    container_name: crm-functions
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    command: ["start", "--main-service", "/home/deno/functions/main"]
    environment:
      SUPABASE_URL: http://crm-gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FUNCTION_SECRET: ${EMAIL_FUNCTION_SECRET}
      SIIGO_USERNAME: ${SIIGO_USERNAME}
      SIIGO_ACCESS_KEY: ${SIIGO_ACCESS_KEY}
    volumes:
      # preparar-funciones.sh copia aquí supabase/functions del repositorio + main/
      - ./functions:/home/deno/functions:ro
    networks: [crm-net]

  gateway:
    image: caddy:2-alpine
    container_name: crm-gateway
    restart: unless-stopped
    depends_on: [rest, auth, realtime, storage, functions]
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [crm-net]

  nginx:
    image: nginx:alpine
    container_name: crm-nginx
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "8300:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [crm-net]

volumes:
  crm-db-data:
  crm-storage-data:

networks:
  crm-net:
    name: crm-net
