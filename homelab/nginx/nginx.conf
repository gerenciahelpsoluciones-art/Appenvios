# GUARDIÁN DEL CRM (nginx) — límite de peticiones por IP, igual que el de la mesa de ayuda.
#
# Queda delante del gateway (crm-gateway:8000). Las oficinas salen a internet con UNA IP
# compartida, por eso los límites son más holgados que los de la mesa:
#   · /auth/v1  → 5 peticiones/s (burst 20)   ← el login es lo más caro (bcrypt)
#   · /rest/v1  → 50 peticiones/s (burst 100)  ← el CRM carga ~15 tablas al entrar
#   · el resto  → 60 peticiones/s (burst 120)
#
# IP real: el tráfico llega del VPS por Tailscale (100.64.0.0/10) con X-Forwarded-For.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format corto '$remote_addr "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log corto;

    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=rest:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;

    client_max_body_size 50m;          # fotos de entregas y documentos de registro
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;
    keepalive_timeout 30s;

    resolver 127.0.0.11 ipv6=off valid=10s;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 100.64.0.0/10;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        set $crm "http://crm-gateway:8000";

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;          # sincronizaciones de Siigo y websockets de realtime
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;

        limit_conn conn 60;

        location /auth/v1/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass $crm;
        }
        location /rest/v1/ {
            limit_req zone=rest burst=100 nodelay;
            proxy_pass $crm;
        }
        location /realtime/v1/ {
            proxy_read_timeout 3600s;     # el websocket queda abierto mientras el CRM esté abierto
            proxy_pass $crm;
        }
        location / {
            limit_req zone=general burst=120 nodelay;
            proxy_pass $crm;
        }
    }
}
