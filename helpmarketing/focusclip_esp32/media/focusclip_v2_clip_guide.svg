<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 580" width="860" height="580" font-family="Segoe UI, Arial, sans-serif">

  <rect width="860" height="580" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="white">FocusClip V2.0 — Clip de Mandíbula</text>
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#94a3b8">Sin resortes · 1 tornillo M3 · LED apunta al usuario</text>

  <!-- ══════════════════════════════════════════════════
       VISTA LATERAL — cómo se monta en el monitor
       ══════════════════════════════════════════════════ -->

  <!-- Monitor body -->
  <rect x="340" y="100" width="22" height="340" rx="3" fill="#334155"/>
  <rect x="340" y="96" width="22" height="10" rx="2" fill="#475569"/>
  <!-- monitor stand -->
  <rect x="333" y="440" width="36" height="10" rx="2" fill="#475569"/>
  <rect x="347" y="450" width="8" height="28" fill="#475569"/>
  <rect x="330" y="476" width="42" height="7" rx="3" fill="#64748b"/>
  <!-- Monitor label -->
  <text x="400" y="270" font-size="11" fill="#64748b">Monitor</text>
  <line x1="395" y1="267" x2="365" y2="267" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- ── Mandíbula SUPERIOR (detrás del monitor) ── -->
  <rect x="290" y="88" width="52" height="7" rx="2" fill="#1d4ed8"/>
  <!-- arm going behind -->
  <rect x="290" y="88" width="7" height="55" rx="2" fill="#1e40af"/>
  <!-- lip at end -->
  <rect x="283" y="133" width="14" height="10" rx="2" fill="#1e40af"/>
  <!-- mounting plate (right side of jaw_top, connects to box back) -->
  <rect x="362" y="108" width="7" height="36" rx="2" fill="#2563eb"/>

  <!-- ── Cuerpo del dispositivo ── -->
  <rect x="369" y="75" width="80" height="70" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>

  <!-- LED window on FRONT face (left side = user side) -->
  <rect x="369" y="108" width="7" height="24" rx="3" fill="#22d3ee"/>
  <!-- LED glow effect -->
  <rect x="355" y="106" width="16" height="28" rx="3" fill="#06b6d4" opacity="0.3"/>
  <rect x="340" y="104" width="18" height="32" rx="4" fill="#06b6d4" opacity="0.12"/>

  <!-- LED label with arrow -->
  <text x="240" y="118" text-anchor="end" font-size="11" fill="#22d3ee" font-weight="bold">Ventana LED</text>
  <text x="240" y="131" text-anchor="end" font-size="10" fill="#67e8f9">(cara frontal)</text>
  <line x1="243" y1="122" x2="368" y2="122" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="368,119 375,122 368,125" fill="#22d3ee"/>

  <!-- Logo on box -->
  <text x="409" y="100" text-anchor="middle" font-size="8" fill="#bfdbfe">FocusClip</text>

  <!-- Small top window -->
  <rect x="397" y="143" width="24" height="8" rx="2" fill="#a5f3fc" opacity="0.7"/>

  <!-- USB-C on right side -->
  <rect x="447" y="120" width="5" height="7" rx="1" fill="#fbbf24"/>
  <text x="458" y="126" font-size="9" fill="#fbbf24">USB-C</text>

  <!-- ── Mandíbula INFERIOR (frente del monitor) ── -->
  <rect x="369" y="146" width="50" height="8" rx="2" fill="#60a5fa"/>
  <!-- M3 tightening bolt -->
  <line x1="394" y1="97" x2="394" y2="155" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5,2"/>
  <polygon points="390,97 398,97 394,88" fill="#fbbf24"/>
  <text x="470" y="158" font-size="10" fill="#fbbf24">M3×25mm</text>
  <text x="470" y="170" font-size="10" fill="#fbbf24">aprieta ↑</text>

  <!-- Gap annotation (bezel thickness) -->
  <line x1="363" y1="97" x2="363" y2="145" stroke="#10b981" stroke-width="1.5"/>
  <line x1="358" y1="97" x2="368" y2="97" stroke="#10b981" stroke-width="1"/>
  <line x1="358" y1="145" x2="368" y2="145" stroke="#10b981" stroke-width="1"/>
  <text x="345" y="118" font-size="9" fill="#10b981" text-anchor="middle">bezel</text>
  <text x="345" y="130" font-size="9" fill="#10b981" text-anchor="middle">8–16mm</text>

  <!-- User arrow -->
  <text x="180" y="125" font-size="13" fill="#4ade80" font-weight="bold">USUARIO</text>
  <line x1="215" y1="122" x2="268" y2="122" stroke="#4ade80" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="268,118 278,122 268,126" fill="#4ade80"/>
  <text x="195" y="140" font-size="10" fill="#86efac">ve el LED aquí</text>
  <text x="185" y="153" font-size="10" fill="#86efac">↓ luz de alerta</text>

  <!-- ══════════════════════════════════════════════════
       VISTA EXPLOSIONADA — piezas separadas
       ══════════════════════════════════════════════════ -->

  <text x="620" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Piezas (5 STL)</text>

  <!-- Piece 1: lower_body -->
  <rect x="540" y="95" width="160" height="52" rx="5" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="540" y="115" width="12" height="22" rx="2" fill="#22d3ee"/>
  <rect x="692" y="120" width="8" height="10" rx="1" fill="#fbbf24"/>
  <text x="565" y="109" font-size="10" fill="#bfdbfe" font-weight="bold">1. Cuerpo inferior</text>
  <text x="565" y="122" font-size="9" fill="#93c5fd">• Ventana LED frontal</text>
  <text x="565" y="133" font-size="9" fill="#93c5fd">• Postes M3 internos</text>
  <text x="565" y="144" font-size="9" fill="#93c5fd">• Agujeros clip traseros</text>

  <!-- Piece 2: upper_lid -->
  <rect x="540" y="160" width="160" height="40" rx="5" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="620" y="168" width="32" height="12" rx="2" fill="#a5f3fc" opacity="0.6"/>
  <text x="565" y="174" font-size="10" fill="#bfdbfe" font-weight="bold">2. Tapa superior</text>
  <text x="565" y="186" font-size="9" fill="#93c5fd">• Ventanita estado (arriba)</text>
  <text x="565" y="197" font-size="9" fill="#93c5fd">• 4× M3×10mm esquinas</text>

  <!-- Piece 3: clip_jaw_top -->
  <rect x="540" y="214" width="160" height="52" rx="5" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="540" y="240" width="160" height="8" rx="2" fill="#2563eb"/>
  <rect x="540" y="226" width="14" height="26" rx="2" fill="#1d4ed8"/>
  <text x="565" y="228" font-size="10" fill="#bfdbfe" font-weight="bold">3. Mandíbula superior (fija)</text>
  <text x="565" y="240" font-size="9" fill="#93c5fd">• Va DETRÁS del monitor</text>
  <text x="565" y="251" font-size="9" fill="#93c5fd">• 2× M3×8mm al cuerpo</text>
  <text x="565" y="262" font-size="9" fill="#93c5fd">• Tuerca M3 embebida</text>

  <!-- Piece 4: clip_jaw_bot -->
  <rect x="540" y="280" width="160" height="40" rx="5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="565" y="294" font-size="10" fill="#bfdbfe" font-weight="bold">4. Mandíbula inferior (móvil)</text>
  <text x="565" y="306" font-size="9" fill="#93c5fd">• Va DELANTE del monitor</text>
  <text x="565" y="318" font-size="9" fill="#93c5fd">• 1× M3×25mm la aprieta</text>

  <!-- Piece 5: diffuser -->
  <rect x="540" y="334" width="160" height="32" rx="5" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="565" y="348" font-size="10" fill="#a5f3fc" font-weight="bold">5. Difusor LED (frontal)</text>
  <text x="565" y="361" font-size="9" fill="#67e8f9">• PETG transparente o PLA blanco</text>

  <!-- ══════════════════════════════════════════════════
       CÓMO SE ARMA (pasos)
       ══════════════════════════════════════════════════ -->

  <rect x="20" y="380" width="540" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="290" y="402" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Cómo montar en el monitor</text>

  <!-- Step 1 -->
  <circle cx="50" cy="428" r="12" fill="#3b82f6"/>
  <text x="50" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>
  <text x="72" y="424" font-size="11" fill="white" font-weight="600">Enrosca la mandíbula superior al cuerpo</text>
  <text x="72" y="438" font-size="10" fill="#94a3b8">2× M3×8mm en la pared trasera del dispositivo</text>

  <!-- Step 2 -->
  <circle cx="50" cy="464" r="12" fill="#3b82f6"/>
  <text x="50" y="468" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>
  <text x="72" y="460" font-size="11" fill="white" font-weight="600">Cuelga la mandíbula superior sobre el monitor</text>
  <text x="72" y="474" font-size="10" fill="#94a3b8">El brazo trasero baja por detrás del panel</text>

  <!-- Step 3 -->
  <circle cx="50" cy="500" r="12" fill="#3b82f6"/>
  <text x="50" y="504" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>
  <text x="72" y="496" font-size="11" fill="white" font-weight="600">Coloca la mandíbula inferior por delante</text>
  <text x="72" y="510" font-size="10" fill="#94a3b8">Pasa el tornillo M3×25mm por los dos agujeros</text>

  <!-- Step 4 -->
  <circle cx="50" cy="536" r="12" fill="#10b981"/>
  <text x="50" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4</text>
  <text x="72" y="532" font-size="11" fill="white" font-weight="600">Aprieta el tornillo — listo</text>
  <text x="72" y="546" font-size="10" fill="#94a3b8">El LED ilumina directo hacia el usuario  💡</text>

  <!-- Hardware list -->
  <rect x="578" y="380" width="262" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="708" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Hardware necesario</text>

  <text x="598" y="426" font-size="12" fill="#fbbf24">●</text>
  <text x="616" y="426" font-size="11" fill="#e2e8f0">4× M3×10mm</text>
  <text x="616" y="439" font-size="9" fill="#64748b">tapa + cuerpo (esquinas)</text>

  <text x="598" y="458" font-size="12" fill="#fbbf24">●</text>
  <text x="616" y="458" font-size="11" fill="#e2e8f0">2× M3×8mm</text>
  <text x="616" y="471" font-size="9" fill="#64748b">mandíbula superior → cuerpo</text>

  <text x="598" y="490" font-size="12" fill="#fbbf24">●</text>
  <text x="616" y="490" font-size="11" fill="#e2e8f0">1× M3×25mm</text>
  <text x="616" y="503" font-size="9" fill="#64748b">apriete mandíbula inferior</text>

  <text x="598" y="522" font-size="12" fill="#fbbf24">●</text>
  <text x="616" y="522" font-size="11" fill="#e2e8f0">1× tuerca M3</text>
  <text x="616" y="535" font-size="9" fill="#64748b">embebida en mandíbula superior</text>

  <rect x="590" y="546" width="230" height="4" rx="2" fill="#334155"/>
  <text x="706" y="558" text-anchor="middle" font-size="10" fill="#10b981">Total: 8 tornillos · 1 tuerca</text>

</svg>
