<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#f0f4f8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">FocusClip — Guía de Montaje</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#64748b">Dos opciones de soporte · Sin resortes · Impresión 3D</text>

  <!-- ═══════════════════════════════════════ -->
  <!--  PANEL IZQUIERDO: Monitor Hook          -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="20" y="75" width="420" height="510" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="20" y="75" width="420" height="44" rx="14" fill="#3b82f6"/>
  <rect x="20" y="97" width="420" height="22" fill="#3b82f6"/>
  <text x="230" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="white">① Gancho de Monitor</text>
  <text x="230" y="116" text-anchor="middle" font-size="11" fill="#bfdbfe">1 sola pieza · Sin hardware extra · Fit bezels 4–22 mm</text>

  <!-- Monitor body (side view) -->
  <!-- Monitor screen panel -->
  <rect x="80" y="155" width="14" height="220" rx="3" fill="#475569"/>
  <!-- Monitor stand -->
  <rect x="75" y="375" width="24" height="12" rx="2" fill="#64748b"/>
  <rect x="84" y="387" width="6" height="30" fill="#64748b"/>
  <rect x="70" y="415" width="34" height="8" rx="3" fill="#94a3b8"/>

  <!-- Monitor top bezel detail -->
  <rect x="80" y="148" width="14" height="14" rx="2" fill="#64748b"/>
  <text x="105" y="158" font-size="10" fill="#94a3b8">bezel</text>
  <text x="105" y="170" font-size="10" fill="#94a3b8">10–18mm</text>

  <!-- Hook body (side view cross-section) -->
  <!-- Shelf (rests on top of monitor) -->
  <rect x="62" y="140" width="54" height="11" rx="3" fill="#2563eb"/>
  <!-- Rear arm (goes behind monitor) -->
  <rect x="62" y="140" width="11" height="52" rx="2" fill="#1d4ed8"/>
  <!-- Lip at bottom of rear arm -->
  <rect x="55" y="182" width="18" height="10" rx="2" fill="#1d4ed8"/>
  <!-- Neck between shelf and mounting plate -->
  <rect x="88" y="110" width="11" height="32" rx="2" fill="#3b82f6"/>
  <!-- Mounting plate (on top of enclosure lid) -->
  <rect x="73" y="96" width="54" height="14" rx="3" fill="#3b82f6"/>

  <!-- FocusClip enclosure (side view) -->
  <rect x="66" y="60" width="68" height="38" rx="5" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="75" y="63" width="50" height="8" rx="2" fill="#93c5fd" opacity="0.8"/>
  <text x="100" y="84" text-anchor="middle" font-size="9" fill="white" font-weight="bold">FocusClip</text>

  <!-- M3 screws -->
  <circle cx="82" cy="103" r="2.5" fill="#fbbf24"/>
  <circle cx="118" cy="103" r="2.5" fill="#fbbf24"/>
  <text x="145" y="106" font-size="10" fill="#b45309">M3×8mm</text>

  <!-- Arrows and labels -->
  <!-- Arrow: weight pushes down -->
  <line x1="145" y1="75" x2="145" y2="95" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arr_red)"/>
  <text x="150" y="80" font-size="10" fill="#ef4444">Peso caja</text>
  <text x="150" y="91" font-size="10" fill="#ef4444">⬇ sujeta</text>

  <!-- Arrow: monitor bezel -->
  <line x1="115" y1="155" x2="130" y2="155" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Gap annotation -->
  <line x1="56" y1="151" x2="56" y2="181" stroke="#10b981" stroke-width="1.5"/>
  <line x1="51" y1="151" x2="61" y2="151" stroke="#10b981" stroke-width="1"/>
  <line x1="51" y1="181" x2="61" y2="181" stroke="#10b981" stroke-width="1"/>
  <text x="35" y="164" font-size="9" fill="#059669" text-anchor="middle">gap</text>
  <text x="35" y="174" font-size="9" fill="#059669" text-anchor="middle">bezel</text>

  <!-- Step annotations -->
  <rect x="42" y="248" width="356" height="148" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="220" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Cómo instalar</text>

  <circle cx="65" cy="292" r="10" fill="#3b82f6"/>
  <text x="65" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>
  <text x="85" y="289" font-size="11" fill="#1e293b" font-weight="600">Atornilla el gancho a la tapa</text>
  <text x="85" y="303" font-size="10" fill="#64748b">2× M3×8mm en los agujeros centrales</text>

  <circle cx="65" cy="323" r="10" fill="#3b82f6"/>
  <text x="65" y="327" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>
  <text x="85" y="320" font-size="11" fill="#1e293b" font-weight="600">Coloca el estante sobre el monitor</text>
  <text x="85" y="334" font-size="10" fill="#64748b">El brazo trasero desciende por detrás del panel</text>

  <circle cx="65" cy="354" r="10" fill="#3b82f6"/>
  <text x="65" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>
  <text x="85" y="351" font-size="11" fill="#1e293b" font-weight="600">El peso lo fija solo</text>
  <text x="85" y="365" font-size="10" fill="#64748b">El labio inferior evita que resbale hacia atrás</text>

  <circle cx="65" cy="385" r="10" fill="#10b981"/>
  <text x="65" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="white">✓</text>
  <text x="85" y="382" font-size="11" fill="#1e293b" font-weight="600">LED queda frente al usuario</text>
  <text x="85" y="396" font-size="10" fill="#64748b">Sensor MPU6050 detecta postura correctamente</text>

  <!-- Tip box -->
  <rect x="42" y="406" width="356" height="48" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="62" y="423" font-size="11" fill="#92400e" font-weight="bold">💡 Tip:</text>
  <text x="62" y="437" font-size="10" fill="#92400e">Pega foam autoadhesivo en el estante para</text>
  <text x="62" y="449" font-size="10" fill="#92400e">proteger el bisel y mejorar el agarre.</text>

  <!-- Top-front view sketch -->
  <rect x="280" y="155" width="130" height="80" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="345" y="170" text-anchor="middle" font-size="10" fill="#94a3b8">Vista frontal</text>
  <!-- Enclosure top view -->
  <rect x="296" y="175" width="98" height="52" rx="4" fill="#60a5fa" opacity="0.7"/>
  <!-- LED window -->
  <rect x="310" y="182" width="56" height="18" rx="3" fill="#a5f3fc" opacity="0.9"/>
  <text x="338" y="195" text-anchor="middle" font-size="8" fill="#0e7490">LED</text>
  <!-- Hook outline on top -->
  <rect x="310" y="174" width="56" height="7" rx="2" fill="#1d4ed8" opacity="0.8"/>
  <text x="338" y="245" text-anchor="middle" font-size="9" fill="#64748b">Gancho (azul oscuro)</text>

  <!-- ═══════════════════════════════════════ -->
  <!--  PANEL DERECHO: Desk Clamp              -->
  <!-- ═══════════════════════════════════════ -->
  <rect x="460" y="75" width="420" height="510" rx="14" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="460" y="75" width="420" height="44" rx="14" fill="#7c3aed"/>
  <rect x="460" y="97" width="420" height="22" fill="#7c3aed"/>
  <text x="670" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="white">② Abrazadera de Escritorio</text>
  <text x="670" y="116" text-anchor="middle" font-size="11" fill="#ddd6fe">2 piezas · 1× tornillo M4 · Fit mesas 10–35 mm</text>

  <!-- Desk surface (side view) -->
  <rect x="480" y="200" width="260" height="18" rx="3" fill="#92400e"/>
  <rect x="480" y="218" width="260" height="120" rx="0" fill="#a16207" opacity="0.3"/>

  <!-- Clamp body (C shape side view) -->
  <!-- Top lip (sits on desk top) -->
  <rect x="530" y="160" width="80" height="14" rx="3" fill="#7c3aed"/>
  <!-- Vertical spine of C -->
  <rect x="530" y="160" width="12" height="66" rx="2" fill="#6d28d9"/>
  <!-- Mounting plate on top of spine -->
  <rect x="516" y="134" width="80" height="14" rx="3" fill="#7c3aed"/>
  <!-- Neck between plate and C-body -->
  <rect x="548" y="148" width="12" height="14" rx="2" fill="#8b5cf6"/>

  <!-- FocusClip enclosure on top -->
  <rect x="510" y="96" width="92" height="40" rx="5" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="522" y="99" width="68" height="9" rx="2" fill="#c4b5fd" opacity="0.8"/>
  <text x="556" y="123" text-anchor="middle" font-size="9" fill="white" font-weight="bold">FocusClip</text>

  <!-- Movable jaw (bottom) -->
  <rect x="528" y="218" width="84" height="13" rx="3" fill="#a78bfa"/>

  <!-- M4 screw (vertical tightening) -->
  <line x1="570" y1="226" x2="570" y2="198" stroke="#fbbf24" stroke-width="3" stroke-dasharray="4,2"/>
  <polygon points="566,198 574,198 570,190" fill="#fbbf24"/>
  <text x="600" y="211" font-size="10" fill="#b45309">M4×16mm</text>
  <text x="600" y="223" font-size="10" fill="#b45309">aprieta</text>

  <!-- M3 screws on mounting plate -->
  <circle cx="530" cy="141" r="2.5" fill="#fbbf24"/>
  <circle cx="586" cy="141" r="2.5" fill="#fbbf24"/>
  <text x="420" y="144" font-size="10" fill="#b45309" text-anchor="end">M3×8mm</text>

  <!-- Gap annotation desk clamp -->
  <line x1="524" y1="175" x2="524" y2="200" stroke="#10b981" stroke-width="1.5"/>
  <line x1="519" y1="175" x2="529" y2="175" stroke="#10b981" stroke-width="1"/>
  <line x1="519" y1="200" x2="529" y2="200" stroke="#10b981" stroke-width="1"/>
  <text x="508" y="186" font-size="9" fill="#059669" text-anchor="middle">grosor</text>
  <text x="508" y="197" font-size="9" fill="#059669" text-anchor="middle">mesa</text>

  <!-- Desk label -->
  <text x="760" y="213" font-size="11" fill="#92400e" font-weight="bold">Escritorio</text>

  <!-- Step annotations desk clamp -->
  <rect x="482" y="252" width="356" height="168" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="660" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Cómo instalar</text>

  <circle cx="505" cy="296" r="10" fill="#7c3aed"/>
  <text x="505" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="white">1</text>
  <text x="525" y="293" font-size="11" fill="#1e293b" font-weight="600">Atornilla la abrazadera a la tapa</text>
  <text x="525" y="307" font-size="10" fill="#64748b">2× M3×8mm — igual que el gancho</text>

  <circle cx="505" cy="328" r="10" fill="#7c3aed"/>
  <text x="505" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="white">2</text>
  <text x="525" y="325" font-size="11" fill="#1e293b" font-weight="600">Posiciona sobre el borde de la mesa</text>
  <text x="525" y="339" font-size="10" fill="#64748b">El labio superior descansa sobre la superficie</text>

  <circle cx="505" cy="360" r="10" fill="#7c3aed"/>
  <text x="505" y="364" text-anchor="middle" font-size="11" font-weight="bold" fill="white">3</text>
  <text x="525" y="357" font-size="11" fill="#1e293b" font-weight="600">Aprieta el tornillo M4 por abajo</text>
  <text x="525" y="371" font-size="10" fill="#64748b">La mordaza inferior sube y fija la abrazadera</text>

  <circle cx="505" cy="392" r="10" fill="#7c3aed"/>
  <text x="505" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="white">4</text>
  <text x="525" y="389" font-size="11" fill="#1e293b" font-weight="600">Orienta el LED hacia el usuario</text>
  <text x="525" y="403" font-size="10" fill="#64748b">Ajusta el ángulo girando la caja antes de apretar</text>

  <circle cx="505" cy="420" r="10" fill="#10b981"/>
  <text x="505" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="white">✓</text>
  <text x="525" y="417" font-size="11" fill="#1e293b" font-weight="600">Listo — sin moverse aunque se golpee la mesa</text>

  <!-- Tip box desk -->
  <rect x="482" y="430" width="356" height="50" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="500" y="447" font-size="11" fill="#92400e" font-weight="bold">💡 Tip:</text>
  <text x="500" y="461" font-size="10" fill="#92400e">Ideal para escritorios con borde de 15–25mm.</text>
  <text x="500" y="473" font-size="10" fill="#92400e">Las ranuras antideslizantes evitan rayones.</text>

  <!-- ─── Bottom comparison bar ─── -->
  <rect x="20" y="592" width="860" height="22" rx="8" fill="#1e293b"/>
  <text x="150" y="607" text-anchor="middle" font-size="11" fill="#93c5fd">Gancho Monitor → sin herramientas</text>
  <text x="440" y="607" text-anchor="middle" font-size="11" fill="#94a3b8">|</text>
  <text x="700" y="607" text-anchor="middle" font-size="11" fill="#c4b5fd">Abrazadera Escritorio → máxima sujeción</text>
  <text x="440" y="607" text-anchor="middle" font-size="11" fill="#6b7280">·  Mismo montaje: 2× M3 en tapa  ·</text>

  <!-- Arrow defs -->
  <defs>
    <marker id="arr_red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ef4444"/>
    </marker>
  </defs>

</svg>
