<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#06402b"/>

  <!-- Letter A (left) -->
  <!-- Left diagonal -->
  <rect x="5" y="7" width="2.5" height="14" rx="1"
        transform="rotate(15 5 7)" fill="#f0fdf4"/>
  <!-- Right diagonal -->
  <rect x="11" y="7" width="2.5" height="14" rx="1"
        transform="rotate(-15 13.5 7)" fill="#f0fdf4"/>
  <!-- Crossbar of A -->
  <rect x="6.5" y="14.5" width="6" height="2" rx="0.8" fill="#f0fdf4"/>

  <!-- Letter L (right) -->
  <!-- Vertical stroke -->
  <rect x="18" y="7" width="2.5" height="14" rx="1" fill="#f0fdf4"/>
  <!-- Horizontal foot -->
  <rect x="18" y="18.5" width="7" height="2.5" rx="1" fill="#f0fdf4"/>

  <!-- Emerald dot accent -->
  <circle cx="16" cy="25.5" r="1.5" fill="#10b981"/>
</svg>
