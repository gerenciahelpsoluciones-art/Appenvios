<svg viewBox="0 0 240 72" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1c26"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4AF6A"/>
      <stop offset="100%" stop-color="#A37E3E"/>
    </linearGradient>
  </defs>

  <!-- Icon background -->
  <rect x="0" y="4" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- iPhone silhouette -->
  <rect x="18" y="13" width="28" height="46" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.8"/>

  <!-- Notch -->
  <rect x="26" y="13" width="12" height="4" rx="2" fill="#111118"/>

  <!-- Screen area -->
  <rect x="21" y="18" width="22" height="32" rx="2" fill="#1a1a28"/>

  <!-- "i" on screen -->
  <circle cx="32" cy="23" r="2.2" fill="url(#gold)"/>
  <rect x="30.2" y="27" width="3.6" height="18" rx="1.8" fill="url(#gold)"/>

  <!-- Home bar -->
  <rect x="27" y="54" width="10" height="2.5" rx="1.25" fill="#C5A059" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="80" y="38" font-size="26" font-weight="800" letter-spacing="-0.5" fill="none">
    <tspan fill="url(#gold)">i</tspan><tspan fill="#ffffff">Store</tspan>
  </text>
  <text x="81" y="54" font-size="10.5" font-weight="600" letter-spacing="3.5" fill="#5a5a72">MEDELLÍN</text>
</svg>
