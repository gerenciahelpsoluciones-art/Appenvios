<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C97A"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(197,160,89,0.15)" stroke-width="1"/>

  <!-- Phone body -->
  <rect x="16" y="10" width="32" height="44" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.8"/>

  <!-- Side buttons -->
  <rect x="14.1" y="19" width="1.9" height="7" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="14.1" y="28" width="1.9" height="10" rx="1" fill="url(#gold)" opacity="0.6"/>
  <rect x="48" y="22" width="1.9" height="9" rx="1" fill="url(#gold)" opacity="0.6"/>

  <!-- Screen -->
  <rect x="19" y="14" width="26" height="32" rx="3" fill="rgba(197,160,89,0.07)"/>

  <!-- Notch -->
  <rect x="27" y="10" width="10" height="3.5" rx="1.75" fill="#0d0d18"/>
  <circle cx="34" cy="11.75" r="1" fill="rgba(197,160,89,0.3)"/>

  <!-- "i" — dot -->
  <circle cx="32" cy="20" r="2.5" fill="url(#gold)" filter="url(#glow)"/>

  <!-- "i" — stem -->
  <rect x="29.8" y="24.5" width="4.4" height="17" rx="2.2" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Home indicator bar -->
  <rect x="26" y="49" width="12" height="2" rx="1" fill="url(#gold)" opacity="0.45"/>
</svg>
